name: build

# Builds the plugin's worker bundle (dist/) and packs a loadable tarball.
# A Paperclip sandbox-provider plugin is a Node worker (dist/worker.js), not a
# native binary, so "the build" is the TypeScript -> JS compile plus `npm pack`.
#
# Dependency note: @nvidia/openshell-sdk is published on GitHub Packages and
# needs a token with read:packages (set a repo/org secret NODE_AUTH_TOKEN, or
# the default GITHUB_TOKEN is used). @paperclipai/plugin-sdk comes from npm and
# is pinned to the Paperclip release this plugin targets. package-lock.json is
# committed and installs use `npm ci`, so the build is reproducible.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24" # Paperclip requires >= 24.11
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@nvidia"

      - name: Install dependencies
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (tsc -> dist/)
        run: npm run build

      - name: Pack loadable tarball
        run: npm pack

      - name: Upload package tarball
        uses: actions/upload-artifact@v7
        with:
          name: paperclip-plugin-openshell-tgz
          path: "*.tgz"
          if-no-files-found: error
